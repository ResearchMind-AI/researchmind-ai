# ResearchMind AI — run the whole POC on any machine with Docker.
#
#   1. cp backend/.env.example backend/.env   (add OPENAI_API_KEY at minimum)
#   2. docker compose up -d --build            -> http://localhost:8000
#   3. To share it for testing:  docker compose --profile share up -d
#      then: docker compose logs tunnel | grep trycloudflare.com   (public https link)
#
# API docs: http://localhost:8000/api/docs  (frontend dev server: cd frontend && npm run dev)

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: researchmind
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: researchmind_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: researchmind-backend:latest
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://researchmind:devpassword@db:5432/researchmind_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Free public HTTPS link for testers (Cloudflare quick tunnel, no account needed).
  # The link changes each time the tunnel restarts.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    depends_on:
      - api
    profiles: ["share"]
    restart: unless-stopped

volumes:
  pgdata:
