events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend {
        server backend:8000;
    }

    # ── HTTP — serves Let's Encrypt challenge and redirects to HTTPS ───────────
    #
    # On a fresh deployment, this block handles all traffic.
    # Once you have a domain and SSL cert, uncomment the HTTPS server block below
    # and the redirect rule in this block.
    #
    server {
        listen 80;
        server_name _; # Replace _ with your domain once you have one

        # Let's Encrypt ACME challenge (needed to obtain the SSL cert)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Redirect to HTTPS (uncomment after certbot issues a cert) ─────────
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # API — proxied to FastAPI backend
        location /api {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering    off;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/health;
        }

        # Web app (served by the backend). Answers stream, so don't buffer.
        location / {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering    off;
        }
    }

    # ── HTTPS — uncomment after running certbot ────────────────────────────────
    #
    # Replace YOUR_DOMAIN with your actual domain name.
    # Run certbot first:
    #   docker run --rm -v letsencrypt:/etc/letsencrypt -v certbot-webroot:/var/www/certbot \
    #     certbot/certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN
    #
    # server {
    #     listen 443 ssl;
    #     server_name YOUR_DOMAIN;
    #
    #     ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api {
    #         proxy_pass         http://backend;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 120s;
    #     }
    #
    #     location /health {
    #         proxy_pass http://backend/health;
    #     }
    #
    #     location / {
    #         proxy_pass         http://backend;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 300s;
    #         proxy_buffering    off;
    #     }
    # }
}
