name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: researchmind
  APP_DIR: /opt/researchmind

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build Docker images and push to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Frontend build (uncomment when frontend/ directory exists) ────────────
      # - name: Build and push frontend
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./frontend
      #     file: ./frontend/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:latest
      #       ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ steps.sha.outputs.short }}
      #     build-args: |
      #       VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
      #     cache-from: type=gha,scope=frontend
      #     cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Initialize the database (create tables)
  # ─────────────────────────────────────────────────────────────────────────────
  migrate:
    name: Database Init / Migrate
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Wait for SSH readiness
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            # ECR login
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                  ${{ needs.build-and-push.outputs.ecr-registry }}

            # Run create_all to ensure all tables exist
            # (idempotent — safe to run on every deploy)
            docker run --rm \
              --env-file ${{ env.APP_DIR }}/.env \
              ${{ needs.build-and-push.outputs.ecr-registry }}/${{ env.PROJECT_NAME }}-backend:${{ needs.build-and-push.outputs.short-sha }} \
              python -c "
            from app.core.database import engine
            from app.models import Base
            Base.metadata.create_all(bind=engine)
            print('Database tables ready.')
            "

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy containers to EC2
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose and nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,infra/"
          target: ${{ env.APP_DIR }}/

      - name: Deploy containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ${{ env.APP_DIR }}

            # ECR login
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                  ${{ needs.build-and-push.outputs.ecr-registry }}

            # Update image references in .env (remove stale values first)
            grep -v -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env > .env.tmp || true
            echo "BACKEND_IMAGE=${{ needs.build-and-push.outputs.ecr-registry }}/${{ env.PROJECT_NAME }}-backend:${{ needs.build-and-push.outputs.short-sha }}" >> .env.tmp
            echo "FRONTEND_IMAGE=${{ needs.build-and-push.outputs.ecr-registry }}/${{ env.PROJECT_NAME }}-frontend:${{ needs.build-and-push.outputs.short-sha }}" >> .env.tmp
            mv .env.tmp .env

            # Pull new images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove dangling images
            docker image prune -f

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Verify the deployment is healthy
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "✗ Health check failed after 12 attempts"
          exit 1
