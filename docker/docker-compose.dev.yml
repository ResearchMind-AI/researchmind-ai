version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: researchmind_postgres
    environment:
      POSTGRES_USER: researchmind
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: researchmind_db
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - researchmind_network

  redis:
    image: redis:7-alpine
    container_name: researchmind_redis
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - researchmind_network

networks:
  researchmind_network:
    driver: bridge
